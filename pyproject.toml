[project]
name = "manual-maker"
version = "0.1.0"
description = "Record app operations, describe them with Claude Code, edit, and build a Typst manual"
requires-python = ">=3.12"
dependencies = [
    "pynput>=1.7.7",
    "mss>=9.0",
    "pillow>=10.0",
    "uiautomation>=2.0.20",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
manual-maker = "manual_maker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manual_maker"]
